name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer release version from CHANGELOG.txt
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease
        required: true
        default: false
        type: boolean
  push:
    tags:
      - '20.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fabric-release:
    name: Fabric release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: release
        name: Resolve release metadata
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
            prerelease="${DISPATCH_PRERELEASE}"
          else
            version="${GITHUB_REF_NAME}"
            prerelease="false"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: ${version}" >&2
            exit 1
          fi

          if ! awk -v version="${version}" '$1 == version { found = 1 } END { exit !found }' CHANGELOG.txt; then
            echo "Version ${version} is missing from CHANGELOG.txt" >&2
            exit 1
          fi

          awk -v version="${version}" '
            $1 == version {
              line = $0
              sub(/^[^-]*-[[:space:]]*/, "", line)
              print "- " line
              found = 1
              next
            }
            found && /^         - / {
              line = $0
              sub(/^[[:space:]]*/, "", line)
              print "  " line
              next
            }
            found { exit }
            END { if (!found) exit 1 }
          ' CHANGELOG.txt > release-notes.md

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build and verify Fabric
        env:
          MOD_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          ./gradlew
          :fabric:clean
          :textile:clean
          :test
          :compilePluginTestJava
          :validateTranslation
          :fabric:build
          :fabric:apiJar
          -PenabledPlatforms=fabric
          --console=plain
          --rerun-tasks

      - id: artifacts
        name: Inspect release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          main="platform/fabric/build/libs/wthit-26.2-fabric-${VERSION}.jar"
          api="platform/fabric/build/libs/wthit-26.2-fabric-${VERSION}-api.jar"

          python3 - "${main}" "${api}" "${VERSION}" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          main_path = pathlib.Path(sys.argv[1])
          api_path = pathlib.Path(sys.argv[2])
          version = sys.argv[3]
          forbidden_paths = ("/forge/", "/neo/", "/pluginTest/", "/test/", "/stub/")
          forbidden_bytes = (
              b"net/minecraftforge",
              b"net/neoforged",
              b"mcp/mobius/waila/api/forge",
              b"mcp/mobius/waila/api/neo",
              b"org/junit",
              b"plugin/test",
          )

          for path in (main_path, api_path):
              if not path.is_file():
                  raise SystemExit(f"Missing release artifact: {path}")

          with zipfile.ZipFile(main_path) as jar:
              names = jar.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("Duplicate entries found in the Fabric JAR")
              for name in names:
                  normalized = f"/{name}"
                  if any(part in normalized for part in forbidden_paths):
                      raise SystemExit(f"Forbidden entry in Fabric JAR: {name}")
                  if name.endswith(("mods.toml", "neoforge.mods.toml")):
                      raise SystemExit(f"Foreign loader metadata in Fabric JAR: {name}")
                  if name.endswith(".class"):
                      data = jar.read(name)
                      if any(value in data for value in forbidden_bytes):
                          raise SystemExit(f"Forbidden class reference in Fabric JAR: {name}")

              metadata = json.loads(jar.read("fabric.mod.json"))
              expected = {
                  "id": "wthit",
                  "version": version,
              }
              for key, value in expected.items():
                  if metadata.get(key) != value:
                      raise SystemExit(f"fabric.mod.json {key}={metadata.get(key)!r}, expected {value!r}")
              if metadata["depends"].get("minecraft") != "~26.2-":
                  raise SystemExit("Unexpected Minecraft dependency range")
              if metadata["depends"].get("fabricloader") != ">=0.19.3":
                  raise SystemExit("Unexpected Fabric Loader dependency range")
          PY

          jdeps --ignore-missing-deps -verbose:class "${main}" > fabric-release-jdeps.log
          if grep -E 'net\.minecraftforge|net\.neoforged|mcp\.mobius\.waila\.api\.(forge|neo)|org\.junit|plugin\.test' fabric-release-jdeps.log; then
            echo "Forbidden dependency found by jdeps" >&2
            exit 1
          fi

          sha256sum "${main}" "${api}"
          echo "main=${main}" >> "${GITHUB_OUTPUT}"
          echo "api=${api}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: wthit-fabric-${{ steps.release.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.main }}
            ${{ steps.artifacts.outputs.api }}

      - if: always()
        run: ./gradlew --stop

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          MAIN_JAR: ${{ steps.artifacts.outputs.main }}
          API_JAR: ${{ steps.artifacts.outputs.api }}
        shell: bash
        run: |
          args=(
            release create "${VERSION}"
            --repo "${GITHUB_REPOSITORY}"
            --target "${GITHUB_SHA}"
            --title "[26.2 Fabric] ${VERSION}"
            --notes-file release-notes.md
            "${MAIN_JAR}"
            "${API_JAR}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
