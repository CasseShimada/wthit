name: head
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/ISSUE_TEMPLATE/*'
      - 'CHANGELOG.txt'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/ISSUE_TEMPLATE/*'
      - 'CHANGELOG.txt'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: vars
        run: |
          echo "git_hash=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.repository != 'badasintended/wthit' }}
      - name: Build Fabric
        shell: bash
        env:
          GIT_HASH: ${{ steps.vars.outputs.git_hash }}
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :fabric:build -PenabledPlatforms=fabric --console=plain; then
              exit 0
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            echo "Gradle build attempt ${attempt} failed; retrying transient dependency downloads" >&2
            sleep $((attempt * 10))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wthit-${{ steps.vars.outputs.git_hash }}
          path: "./platform/fabric/build/libs/**.jar"
      - run: ./gradlew --stop
